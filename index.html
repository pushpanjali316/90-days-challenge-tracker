<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7C3AED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="90 Days">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>90 Days Challenge Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><h1>90 Days Challenge</h1><p id="sub"></p></header>
<nav id="nav"></nav>
<main id="app"></main>
</div>
<div id="syncbar"><span id="syncmsg"></span><button id="litebtn" type="button" title="Turn animations off to save battery">Lite</button><button id="syncbtn" type="button">Sign in</button></div>
<div id="toast" hidden></div>
<div id="auth" hidden><div class="card"><h2>Sync across devices</h2><p class="muted">Sign in with your email to keep your progress on every device.</p>
<input type="text" id="aemail" placeholder="you@email.com" inputmode="email" autocomplete="email">
<input type="password" id="apass" placeholder="Password (6+ characters)" autocomplete="current-password">
<button class="btn" id="asignin" type="button">Sign in</button>
<button class="btn alt" id="asignup" type="button">Create account</button>
<button class="btn alt" id="aforgot" type="button">Forgot password</button>
<p id="amsg" class="muted"></p>
<button class="btn alt" id="askip" type="button">Continue without sync</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
